<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VertCode Elite</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      padding: 2rem;
      text-align: center;
      border-bottom: 3px solid #e94560;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff;
    }

    header h1 span {
      color: #e94560;
    }

    .phase-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      padding: 1rem 1rem 0;
      position: sticky;
      top: 0;
      background: #0a0a0a;
      z-index: 100;
      border-bottom: 1px solid #1a1a2e;
      padding-bottom: 1rem;
    }

    .phase-btn {
      background: #1a1a2e;
      color: #aaa;
      border: 1px solid #2a2a4e;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .phase-btn:hover {
      background: #2a2a4e;
      color: #fff;
    }

    .phase-btn.active {
      background: #e94560;
      color: #fff;
      border-color: #e94560;
    }

    .content {
      max-width: 900px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    .phase-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .phase-header h2 {
      font-size: 1.6rem;
      color: #fff;
    }

    .phase-header .phase-num {
      color: #e94560;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 0.25rem;
    }

    .workout {
      background: #141428;
      border-radius: 12px;
      margin-bottom: 1.5rem;
      overflow: hidden;
      border: 1px solid #1e1e3a;
    }

    .workout-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.25rem;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s;
    }

    .workout-header:hover {
      background: #1a1a3a;
    }

    .workout-header h3 {
      font-size: 1.1rem;
      color: #fff;
    }

    .workout-header .days {
      font-size: 0.8rem;
      color: #888;
    }

    .workout-header .toggle {
      color: #e94560;
      font-size: 1.2rem;
      transition: transform 0.3s;
    }

    .workout-header .toggle.open {
      transform: rotate(180deg);
    }

    .workout-meta {
      padding: 0 1.25rem 0.75rem;
      display: none;
    }

    .workout-meta.visible {
      display: block;
    }

    .overview-link {
      display: inline-block;
      color: #e94560;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1rem;
      transition: color 0.2s;
    }

    .overview-link:hover {
      color: #ff6b81;
    }

    .exercise {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 0;
      border-top: 1px solid #1e1e3a;
    }

    .exercise-num {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      background: #1e1e3a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: #e94560;
    }

    .exercise-info {
      flex: 1;
      min-width: 0;
    }

    .exercise-name {
      font-weight: 600;
      font-size: 0.95rem;
      color: #ddd;
    }

    .exercise-details {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.3rem;
    }

    .detail-tag {
      font-size: 0.75rem;
      background: #1e1e3a;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      color: #999;
    }

    .exercise-notes {
      font-size: 0.75rem;
      color: #e94560;
      font-style: italic;
      margin-top: 0.2rem;
    }

    .exercise-video {
      flex-shrink: 0;
    }

    .video-btn {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background: #e94560;
      color: #fff;
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .video-btn:hover {
      background: #ff6b81;
    }

    .video-btn svg {
      width: 14px;
      height: 14px;
    }

    @media (max-width: 600px) {
      header h1 { font-size: 1.5rem; }
      .phase-btn { padding: 0.4rem 0.7rem; font-size: 0.75rem; }
      .content { padding: 1rem; }
      .exercise { flex-wrap: wrap; gap: 0.5rem; }
      .exercise-video { width: 100%; }
      .video-btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Vert<span>Code</span> Elite</h1>
  </header>
  <nav class="phase-nav" id="phaseNav"></nav>
  <main class="content" id="content"></main>

  <script>
    let programData = null;
    let activePhase = 0;

    async function loadData() {
      const res = await fetch('exercises.json');
      programData = await res.json();
      renderNav();
      renderPhase(0);
    }

    function renderNav() {
      const nav = document.getElementById('phaseNav');
      nav.innerHTML = programData.phases.map((p, i) =>
        `<button class="phase-btn${i === 0 ? ' active' : ''}" data-index="${i}">
          Phase ${p.phase}
        </button>`
      ).join('');

      nav.addEventListener('click', (e) => {
        const btn = e.target.closest('.phase-btn');
        if (!btn) return;
        const idx = parseInt(btn.dataset.index);
        document.querySelectorAll('.phase-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderPhase(idx);
      });
    }

    function renderPhase(index) {
      activePhase = index;
      const phase = programData.phases[index];
      const content = document.getElementById('content');

      const playSvg = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;

      content.innerHTML = `
        <div class="phase-header">
          <div class="phase-num">Phase ${phase.phase}</div>
          <h2>${phase.title}</h2>
        </div>
        ${phase.workouts.map((w, wi) => `
          <div class="workout">
            <div class="workout-header" data-workout="${wi}">
              <div>
                <h3>${w.name}</h3>
                ${w.days ? `<div class="days">Days: ${w.days.join(', ')}</div>` : ''}
              </div>
              <span class="toggle">&#9662;</span>
            </div>
            <div class="workout-meta" id="workout-${wi}">
              ${w.overviewUrl ? `<a class="overview-link" href="${w.overviewUrl}" target="_blank" rel="noopener">${playSvg} Watch Workout Overview</a>` : ''}
              ${w.exercises.map((ex, ei) => `
                <div class="exercise">
                  <div class="exercise-num">${ei + 1}</div>
                  <div class="exercise-info">
                    <div class="exercise-name">${ex.name}</div>
                    <div class="exercise-details">
                      ${ex.sets ? `<span class="detail-tag">${ex.sets} set${ex.sets > 1 ? 's' : ''}</span>` : ''}
                      ${ex.reps ? `<span class="detail-tag">${ex.reps} reps</span>` : ''}
                      ${ex.duration ? `<span class="detail-tag">${ex.duration}</span>` : ''}
                      ${ex.rest ? `<span class="detail-tag">Rest: ${ex.rest}</span>` : ''}
                    </div>
                    ${ex.notes ? `<div class="exercise-notes">${ex.notes}</div>` : ''}
                  </div>
                  <div class="exercise-video">
                    <a class="video-btn" href="${ex.videoUrl}" target="_blank" rel="noopener">
                      ${playSvg} Video
                    </a>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `).join('')}
      `;

      // Toggle workout sections
      content.querySelectorAll('.workout-header').forEach(header => {
        header.addEventListener('click', () => {
          const idx = header.dataset.workout;
          const meta = document.getElementById(`workout-${idx}`);
          const toggle = header.querySelector('.toggle');
          meta.classList.toggle('visible');
          toggle.classList.toggle('open');
        });
      });

      // Auto-expand first workout
      const firstMeta = document.getElementById('workout-0');
      const firstToggle = content.querySelector('.workout-header .toggle');
      if (firstMeta) {
        firstMeta.classList.add('visible');
        firstToggle.classList.add('open');
      }
    }

    loadData();
  </script>
</body>
</html>
